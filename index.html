<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi Karyawan Delta</title>
    <style>
        /* Gaya dasar tampilan login */
        body {
            font-family: Arial, sans-serif;
            background-color: #1a4f8a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { margin-bottom: 5px; color: #333; }
        p.subtitle { color: #666; margin-top: 0; margin-bottom: 25px; }
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #444; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover { background-color: #0056b3; }
        #errorDiv {
            color: red;
            background-color: #ffe6e6;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
            font-size: 14px;
            border: 1px solid #ffa3a3;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Sistem Informasi Karyawan Delta</h2>
        <p class="subtitle">Login Karyawan</p>

        <!-- Kotak Pesan Error -->
        <div id="errorDiv">❌ ID Karyawan atau Password Salah!</div>

        <!-- Form Login -->
        <form id="loginForm">
            <div class="form-group">
                <label for="usernameInput">ID Karyawan</label>
                <input type="text" id="usernameInput" placeholder="Masukkan nama ID Anda (contoh: jojoanugrah)" required>
            </div>
            <div class="form-group">
                <label for="passwordInput">Kata Sandi</label>
                <input type="password" id="passwordInput" placeholder="Masukkan Password Anda" required>
            </div>
            <button type="submit">Masuk</button>
        </form>
    </div>

    <!-- ========================================== -->
    <!-- 1. PANGGIL FIREBASE SDK LANGSUNG (TANPA JS/) -->
    <!-- ========================================== -->
    <script src="firebase-app-compat.js"></script>
    <script src="firebase-auth-compat.js"></script>
    <script src="firebase-firestore-compat.js"></script>

    <!-- ========================================== -->
    <!-- 2. KONFIGURASI FIREBASE ASLI MILIK ANDA -->
    <!-- ========================================== -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBZmYWxh3E5Zx_5rK8CX1ER2p6tavqS_c8",
            authDomain: "://firebaseapp.com",
            projectId: "chemis-delta",
            storageBucket: "://appspot.com",
            messagingSenderId: "1032338692754", 
            appId: "1:1032338692754:web:6e6f432709e3ee7964b07e"
        };
        
        // Inisialisasi Firebase ke aplikasi
        firebase.initializeApp(firebaseConfig);
    </script>

    <!-- ========================================== -->
    <!-- 3. LOGIKA PROSES LOGIN (KODE ANDA) -->
    <!-- ========================================== -->
     <!-- Hapus script lama Anda dan ganti dengan satu blok script module ini -->
        <script type="module">
        // 1. Import fungsi-fungsi yang dibutuhkan dari CDN Firebase resmi (URL LENGKAP)
        import { initializeApp } from "https://gstatic.com";
        import { getAuth, signInWithEmailAndPassword } from "https://gstatic.com";

        // 2. Konfigurasi Firebase asli milik Anda (SUDAH DIPERBAIKI)
        const firebaseConfig = {
            apiKey: "AIzaSyBZmYWxh3E5Zx_5rK8CX1ER2p6tavqS_c8",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "chemis-delta",
            storageBucket: "chemis-delta.firebasestorage.app",
            messagingSenderId: "162814579641",
            appId: "1:162814579641:web:cf6ec71e7df4969be0dc68",
            measurementId: "G-V8L7163N6X"
        };

        // 3. Inisialisasi Firebase dan Auth
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // 4. Daftarkan elemen DOM
        const loginForm = document.getElementById('loginForm');
        const errorDiv = document.getElementById('errorDiv');
        const usernameInput = document.getElementById('usernameInput');
        const passwordInput = document.getElementById('passwordInput');

        // 5. Logika Proses Login
        loginForm.addEventListener('submit', function(event) {
            // Mencegah halaman reload otomatis
            event.preventDefault(); 
            
            errorDiv.style.display = 'none';
            
            let userInput = usernameInput.value;
            let passwordInputValue = passwordInput.value;
            
            // Otomatis menambahkan domain perusahaan jika user tidak mengetik '@'
            let formattedEmail = userInput;
            if (!userInput.includes('@')) {
                formattedEmail = userInput + "@rayon1.com";
            }
            
            // Proses Otentikasi gaya baru
            signInWithEmailAndPassword(auth, formattedEmail, passwordInputValue)
                .then((userCredential) => {
                    alert("Login Berhasil! Selamat bekerja.");
                    window.location.href = "https://docs.google.com/spreadsheets/d/13LOxjXsBtLFwIvIU4b8btCa2Xnr-nfov86aEz-6lnHo/edit?usp=sharing";
                })
                .catch((error) => {
                    console.error("Firebase Auth Error: ", error.code, error.message);
                    errorDiv.innerText = "❌ ID Karyawan atau Password Salah!";
                    errorDiv.style.display = 'block';
                });
        });
    </script>
